name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Long enough to wait for a signing request's approval.
    timeout-minutes: 360
    env:
      # The switch for signing: on for a tagged release once the SignPath secrets are added (see .signpath/README.md).
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.version.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Optional: without ffmpeg the audio and video tests are skipped, not failed.
      - name: Install ffmpeg
        continue-on-error: true
        run: choco install ffmpeg --no-progress -y

      # Optional too: the Word, EPUB and Markdown-to-DOCX tests need pandoc and skip without it.
      - name: Install pandoc
        continue-on-error: true
        run: choco install pandoc --no-progress -y

      - name: Test
        # Fixtures are generated at test time; Office and LibreOffice tests skip themselves on the runner. The runner is
        # thrown away afterwards, so setup's one test with the real winget runs here (it installs 7-Zip, if winget is on it).
        env:
          TANJELO_REAL_WINGET: '1'
        run: |
          dotnet test --project tests/Tanjelo.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Version
        id: version
        run: |
          # A tag like v1.2.3 sets the version; other builds take the one in Directory.Build.props, marked as a CI build.
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          else { $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version + '-ci.${{ github.run_number }}' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "signed=$env:SIGN" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: |
          # Both are published with the .NET runtime inside, into one folder that the zip and the installer are made from.
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish src/Tanjelo -c Release "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { throw "publishing the app failed" }
          dotnet publish src/tanj -c Release "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { throw "publishing tanj failed" }

          $out = "artifacts/Tanjelo"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src/Tanjelo/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/* $out -Recurse -Force
          Copy-Item src/tanj/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/* $out -Recurse -Force

          # The uninstaller: setup without the app inside, on .NET Framework 4.8, which setup puts beside the app.
          dotnet build src/Tanjelo.Setup -c Release -f net48 "-p:Version=$version" -o artifacts/uninstaller
          if ($LASTEXITCODE -ne 0) { throw "building the uninstaller failed" }
          Copy-Item artifacts/uninstaller/Tanjelo.Setup.exe "$out/Uninstall Tanjelo.exe"

      - name: Windows 11 menu entry
        env:
          CERTIFICATE_SUBJECT: ${{ vars.SIGNPATH_CERTIFICATE_SUBJECT }}
        run: |
          # TanjeloMenu.dll, published natively (NativeAOT, with the runner's C++ tools), and its sparse package. The entry
          # ships only signed: a signed release puts both beside the app, and other builds hand them to the windows11-menu
          # job, which tries them unsigned.
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish src/Tanjelo.ShellMenu -c Release "-p:Version=$version"
          if ($LASTEXITCODE -ne 0) { throw "publishing the menu entry failed" }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe isn't on this runner" }
          New-Item -ItemType Directory -Force artifacts/menu-package, artifacts/menu | Out-Null
          Copy-Item src/Tanjelo.ShellMenu/Package/* artifacts/menu-package -Recurse
          # A package's version is four numbers; its publisher must match the certificate that signs it.
          $manifest = (Get-Content artifacts/menu-package/AppxManifest.xml -Raw) -creplace 'Version="1\.0\.0\.0"', "Version=""$(($version -split '-')[0]).0"""
          if ($env:SIGN -eq 'true') {
            if (-not $env:CERTIFICATE_SUBJECT) { throw "set the SIGNPATH_CERTIFICATE_SUBJECT variable to the signing certificate's subject" }
            $manifest = $manifest -creplace 'Publisher="CN=Tanjelo Test[^"]*"', "Publisher=""$env:CERTIFICATE_SUBJECT"""
          }
          Set-Content artifacts/menu-package/AppxManifest.xml $manifest -NoNewline
          & $makeappx.FullName pack /d artifacts/menu-package /p artifacts/menu/Tanjelo.ShellMenu.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          Copy-Item src/Tanjelo.ShellMenu/bin/Release/net10.0-windows/win-x64/publish/TanjeloMenu.dll artifacts/menu
          if ($env:SIGN -eq 'true') { Copy-Item artifacts/menu/* artifacts/Tanjelo }

      - uses: actions/upload-artifact@v7
        if: env.SIGN != 'true'
        with:
          name: Tanjelo-menu-unsigned
          path: artifacts/menu

      - name: Smoke test
        working-directory: artifacts
        run: |
          # The runtime is inside: nothing to install first.
          foreach ($file in 'hostfxr.dll', 'coreclr.dll', 'PresentationFramework.dll') {
            if (-not (Test-Path "Tanjelo/$file")) { throw "missing Tanjelo/${file}: the folder doesn't carry its own .NET" }
          }
          if (-not (Test-Path "Tanjelo/Uninstall Tanjelo.exe")) { throw "missing the uninstaller" }
          foreach ($app in 'Tanjelo', 'tanj') {
            $config = Get-Content "Tanjelo/$app.runtimeconfig.json" | ConvertFrom-Json
            if (-not $config.runtimeOptions.includedFrameworks) { throw "$app isn't self-contained" }
          }
          # Every component shipped is open source: PDFsharp's Windows Phone font subset stays out (Directory.Build.targets).
          if (Test-Path Tanjelo/PdfSharp.WPFonts.dll) { throw "PdfSharp.WPFonts.dll was published" }
          # Exercises the published binaries: ImageMagick's native DLL, the Windows PDF renderer, Markdig, the PPTX
          # writer, and zip creation.
          $tanj = "./Tanjelo/tanj.exe"
          & $tanj tools
          Add-Type -AssemblyName System.Drawing
          $bitmap = [System.Drawing.Bitmap]::new(64, 48)
          [System.Drawing.Graphics]::FromImage($bitmap).Clear([System.Drawing.Color]::Orange)
          $bitmap.Save("$PWD/smoke.png")
          $bitmap.Dispose()
          Set-Content -Path smoke.md -Value "# Smoke test`n`nIt *works*." -Encoding utf8
          foreach ($step in @(@('jpg', 'smoke.png'), @('pdf', 'smoke.png'), @('png', 'smoke.pdf'), @('compress-zip', 'smoke.png'), @('html', 'smoke.md'), @('pptx', 'smoke.pdf'))) {
            & $tanj convert $step[0] $step[1]
            if ($LASTEXITCODE -ne 0) { throw "tanj convert $($step -join ' ') failed" }
          }
          foreach ($file in 'Tanjelo/LICENSE.txt', 'Tanjelo/THIRD-PARTY-NOTICES.md', 'Tanjelo/licenses/ImageMagick-NOTICE.txt',
                   'Tanjelo/licenses/PdfPig-LICENSE.txt', 'Tanjelo/licenses/PdfPig-NOTICE.txt', 'Tanjelo/licenses/Markdig-LICENSE.txt',
                   'Tanjelo/licenses/WebView2-LICENSE.txt', 'Tanjelo/licenses/YuNet-LICENSE.txt',
                   'Tanjelo/licenses/dotnet-LICENSE.txt', 'Tanjelo/licenses/dotnet-runtime-THIRD-PARTY-NOTICES.txt') {
            if (-not (Test-Path $file)) { throw "missing $file" }
          }

      # ---- Signing through SignPath Foundation: only for tagged releases, and only once the SignPath secrets exist, so
      # the workflow runs the same without them. Each signing request waits for its approval on SignPath, by hand.

      - name: Gather the app's own files to sign
        if: env.SIGN == 'true'
        run: |
          New-Item -ItemType Directory -Force artifacts/to-sign | Out-Null
          foreach ($file in 'Tanjelo.exe', 'Tanjelo.dll', 'tanj.exe', 'tanj.dll', 'Tanjelo.Core.dll', 'TanjeloMenu.dll', 'Tanjelo.ShellMenu.msix', 'Uninstall Tanjelo.exe') {
            Copy-Item "artifacts/Tanjelo/$file" artifacts/to-sign
          }

      - name: Upload them for signing
        id: upload-unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: artifacts/to-sign

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Tanjelo-File-Editor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: 'app'
          github-artifact-id: '${{ steps.upload-unsigned-app.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: 'artifacts/signed-app'

      - name: Put the signed files in place
        if: env.SIGN == 'true'
        run: |
          foreach ($file in Get-ChildItem artifacts/signed-app -File) {
            Copy-Item $file.FullName artifacts/Tanjelo -Force
            $signature = Get-AuthenticodeSignature "artifacts/Tanjelo/$($file.Name)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) isn't signed: $($signature.StatusMessage)" }
          }

      - name: Package
        run: |
          # The zip for portable use, without the uninstaller, and Tanjelo-<version>-Setup.exe: Tanjelo's own setup
          # (src/Tanjelo.Setup) with the whole folder inside as payload.zip, built after the app's files are signed.
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Get-ChildItem artifacts/Tanjelo | Where-Object Name -ne 'Uninstall Tanjelo.exe' |
            Compress-Archive -DestinationPath "artifacts/release/Tanjelo-$version-win-x64.zip"
          $payload = Join-Path $PWD artifacts/payload.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/Tanjelo).Path, $payload, 'Optimal', $false)
          dotnet build src/Tanjelo.Setup -c Release -f net48 "-p:Version=$version" "-p:Payload=$payload" -o artifacts/setup --no-incremental
          if ($LASTEXITCODE -ne 0) { throw "building setup failed" }
          Copy-Item artifacts/setup/Tanjelo.Setup.exe "artifacts/release/Tanjelo-$version-Setup.exe"
          Write-Host "Setup.exe: $([math]::Round((Get-Item "artifacts/release/Tanjelo-$version-Setup.exe").Length / 1MB)) MB"

      - name: Upload the installer for signing
        id: upload-unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: artifacts/release/*-Setup.exe

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Tanjelo-File-Editor' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: 'installer'
          github-artifact-id: '${{ steps.upload-unsigned-installer.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: 'artifacts/signed-installer'

      - name: Put the signed installer in place
        if: env.SIGN == 'true'
        run: |
          $setup = Get-ChildItem artifacts/signed-installer -Filter *-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw "SignPath sent back no installer" }
          Copy-Item $setup.FullName artifacts/release -Force
          $signature = Get-AuthenticodeSignature "artifacts/release/$($setup.Name)"
          if ($signature.Status -ne 'Valid') { throw "the installer isn't signed: $($signature.StatusMessage)" }

      - name: winget manifests
        run: |
          # winget/ holds the manifests with a placeholder; this release's get its version, installer and SHA-256.
          $version = '${{ steps.version.outputs.version }}'
          $hash = (Get-FileHash "artifacts/release/Tanjelo-$version-Setup.exe" -Algorithm SHA256).Hash
          $out = "artifacts/winget/manifests/t/Tanjelo/Tanjelo/$version"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($file in Get-ChildItem winget -Filter *.yaml) {
            $text = (Get-Content $file.FullName -Raw) `
              -replace 'PackageVersion: .*', "PackageVersion: $version" `
              -replace 'download/v[^/]+/Tanjelo-[^/]+-Setup\.exe', "download/v$version/Tanjelo-$version-Setup.exe" `
              -replace 'InstallerSha256: .*', "InstallerSha256: $hash" `
              -replace 'releases/tag/v.*', "releases/tag/v$version"
            Set-Content (Join-Path $out $file.Name) $text -NoNewline
          }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest $out
            if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }
          } else {
            Write-Warning "winget isn't on this runner, so the manifests weren't validated here"
          }
          Compress-Archive -Path artifacts/winget/manifests -DestinationPath artifacts/release/winget-manifests.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Tanjelo-win-x64
          path: artifacts/Tanjelo

      - uses: actions/upload-artifact@v7
        with:
          name: Tanjelo-release
          path: artifacts/release

  installer:
    # Installs the way a user would, on a runner whose own .NET is hidden away: just for the runner's user, for everyone,
    # into a chosen folder, and over a real Tanjelo 1.1.0, each followed by the uninstaller. Checks that each install is
    # whole and works, and that nothing is left behind except files that were never setup's: decoys beside and inside the
    # install folder. tools/setup-checks.ps1 has the checks.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools

      - uses: actions/download-artifact@v8
        with:
          name: Tanjelo-release
          path: release

      - name: Hide the runner's .NET
        run: |
          # PowerShell 7 brings its own runtime, so these steps still run; Tanjelo has only the one it carries, and setup
          # the .NET Framework that's part of Windows.
          Rename-Item "$env:ProgramFiles\dotnet" dotnet-hidden
          if (Get-Command dotnet -ErrorAction SilentlyContinue) { throw "dotnet is still on the PATH" }

      - name: Just for me
        run: |
          . tools/setup-checks.ps1
          $folder = "$env:LOCALAPPDATA\Programs\Tanjelo"
          Set-Content "$env:LOCALAPPDATA\Programs\decoy.txt" 'beside the install folder'
          Invoke-AndWait (Get-Setup) '--silent'
          Test-Installed $folder 'user'
          if (Get-AppsEntry 'machine') { throw "an Apps entry for everyone too" }
          Test-InstalledCopy $folder
          Set-TanjeloExtras "$folder\Tanjelo.exe"
          Invoke-Uninstall $folder 'user'
          Assert-FolderGone $folder
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\decoy.txt")) { throw "the file beside the install folder went" }

      - name: For everyone
        run: |
          # The runner is an administrator already, so setup does it all itself: the prompt can't be tried here.
          . tools/setup-checks.ps1
          $folder = "$env:ProgramFiles\Tanjelo"
          Invoke-AndWait (Get-Setup) '--silent', '--all-users'
          Test-Installed $folder 'machine'
          if (Get-AppsEntry 'user') { throw "an Apps entry just for the user too" }
          Test-InstalledCopy $folder
          Invoke-Uninstall $folder 'machine'
          Assert-FolderGone $folder

      - name: In a chosen folder
        run: |
          . tools/setup-checks.ps1
          $apps = "$env:RUNNER_TEMP\My Apps"
          New-Item -ItemType Directory $apps | Out-Null
          Set-Content "$apps\decoy.txt" 'beside the install folder'
          Invoke-AndWait (Get-Setup) '--silent', '--dir', "`"$apps`""
          # Tanjelo always goes in a folder of its own.
          $folder = "$apps\Tanjelo"
          Test-Installed $folder 'user'
          Set-Content "$folder\notes.txt" 'added by someone'
          Invoke-Uninstall $folder 'user'
          $left = (Get-ChildItem $apps -Recurse -Name | Sort-Object) -join ', '
          if ($left -ne 'decoy.txt, Tanjelo, Tanjelo\notes.txt') { throw "expected only the decoys to stay, found: $left" }

      - name: Over Tanjelo 1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The real 1.1.0, installed by Velopack in %LOCALAPPDATA%\Tanjelo, with pictures held on the shelf, Start with
          # Windows and Send to on. Setup moves it over: Velopack's files go, Tanjelo's data stays, and Windows' entries
          # point at the new copy.
          . tools/setup-checks.ps1
          gh release download v1.1.0 --repo $env:GITHUB_REPOSITORY --pattern 'Tanjelo-1.1.0-Setup.exe' --dir old
          if ($LASTEXITCODE -ne 0) { throw "couldn't download 1.1.0" }
          Invoke-AndWait (Resolve-Path old/Tanjelo-1.1.0-Setup.exe).Path '--silent'
          $root = "$env:LOCALAPPDATA\Tanjelo"
          foreach ($file in "$root\Update.exe", "$root\current\Tanjelo.exe") { if (-not (Test-Path $file)) { throw "1.1.0 didn't install: no $file" } }
          New-Item -ItemType Directory -Force "$root\Clipboard", "$root\WebView2" | Out-Null
          Set-Content "$root\Clipboard\held.png" 'a picture held on the shelf'
          Set-Content "$root\update.json" '{}'
          Set-Content "$root\log.txt" 'the log'
          Set-TanjeloExtras "$root\current\Tanjelo.exe"
          # Velopack starts 1.1.0 once it's installed; setup has to close it first.
          Start-Sleep 5

          Invoke-AndWait (Get-Setup) '--silent'

          $folder = "$env:LOCALAPPDATA\Programs\Tanjelo"
          Test-Installed $folder 'user'
          $gone = 'current', 'packages', 'Update.exe', 'Tanjelo.exe' | Where-Object { Test-Path "$root\$_" }
          if ($gone) { throw "Velopack's files are still there: $($gone -join ', ')" }
          foreach ($kept in 'Clipboard\held.png', 'update.json', 'log.txt', 'WebView2') { if (-not (Test-Path "$root\$kept")) { throw "$kept was lost" } }
          if ((Get-SavedPath 'user') -split ';' -contains "$root\current") { throw "1.1.0's folder is still on the PATH" }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).Tanjelo
          if ($run -ne "`"$folder\Tanjelo.exe`" --autostart") { throw "Start with Windows runs $run" }
          if ((Get-ShortcutTarget "$env:APPDATA\Microsoft\Windows\SendTo\Tanjelo.lnk") -ne "$folder\Tanjelo.exe") { throw "Send to doesn't open the new copy" }
          if (Get-Process | Where-Object { $_.Path -like "$root\*" }) { throw "1.1.0 is still running" }

          Invoke-Uninstall $folder 'user'
          if (Test-Path $root) { throw "%LOCALAPPDATA%\Tanjelo is still there: $((Get-ChildItem $root -Recurse -Name) -join ', ')" }

  windows11-menu:
    # The Windows 11 menu entry, unsigned, as Windows allows only for testing: in developer mode on the administrator
    # runner, its package is registered with the published app as its external location, and the entry is created and
    # invoked as Explorer would, then the package is removed. Signed releases carry the entry; they skip this.
    needs: build
    if: needs.build.outputs.signed != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: Tanjelo-win-x64
          path: app

      - uses: actions/download-artifact@v8
        with:
          name: Tanjelo-menu-unsigned
          path: app

      - name: Register the entry unsigned
        run: |
          $unlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Force $unlock | Out-Null
          Set-ItemProperty $unlock AllowDevelopmentWithoutDevLicense 1 -Type DWord
          Add-AppxPackage -Path app/Tanjelo.ShellMenu.msix -ExternalLocation (Resolve-Path app).Path -AllowUnsigned
          $package = Get-AppxPackage Tanjelo.Menu
          if (-not $package) { throw "the package isn't registered" }
          Write-Host "$($package.PackageFullName), from $($package.InstallLocation)"

      - name: Create and invoke the entry
        env:
          TANJELO_MENU_REGISTERED: '1'
        run: |
          dotnet build tests/Tanjelo.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw "building the tests failed" }
          tests/Tanjelo.Core.Tests/bin/Release/net10.0-windows10.0.19041.0/Tanjelo.Core.Tests.exe -class Tanjelo.Core.Tests.Windows11MenuTests
          if ($LASTEXITCODE -ne 0) { throw "the menu entry didn't work" }

      - name: Remove the entry
        run: |
          Get-AppxPackage Tanjelo.Menu | Remove-AppxPackage
          if (Get-AppxPackage Tanjelo.Menu) { throw "the package is still registered" }

  release:
    if: github.ref_type == 'tag'
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Tanjelo-release
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install with **Tanjelo-${GITHUB_REF_NAME#v}-Setup.exe** (per user, no administrator needed, with a Start menu entry and an uninstaller), or unzip the zip anywhere and run Tanjelo.exe. The .NET runtime is inside both. winget-manifests.zip is for microsoft/winget-pkgs.

          See the [Code signing policy](https://github.com/${GITHUB_REPOSITORY}#code-signing-policy) and the [Privacy](https://github.com/${GITHUB_REPOSITORY}#privacy) statement."
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Tanjelo $GITHUB_REF_NAME" --notes "$notes" --generate-notes
