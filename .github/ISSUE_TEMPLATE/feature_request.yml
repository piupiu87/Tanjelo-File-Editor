name: Feature request
description: A conversion, tool or action you'd like Tanjelo to have.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check docs/ROADMAP.md first; it may already be planned. Tanjelo works offline and never overwrites files, so ideas need to fit that.
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: The files you start with and what you want to end up with.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you do today instead, and how often.
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. A tool or library that could do it, and its licence if you know it.
